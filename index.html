<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fale com uma filial</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Work+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --ink: #000000;
    --panel: #1A3327;
    --panel-line: #2E4B3B;
    --cream: #F3EFE6;
    --cream-dim: #C7CFC7;
    --brass: #C6A15B;
    --brass-dim: #8A7343;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    padding: 0;
    background: var(--ink);
    color: var(--cream);
    font-family: 'Work Sans', sans-serif;
  }

  body {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 48px 20px;
  }

  .board {
    width: 100%;
    max-width: 640px;
  }

  .board__logo {
    height: 84px;
    width: auto;
    display: block;
    margin-bottom: 28px;
  }

  .board__eyebrow {
    font-size: 13px;
    color: var(--brass);
    letter-spacing: 0.02em;
    margin: 0 0 6px 0;
  }

  .board__title {
    font-family: 'Fraunces', serif;
    font-weight: 600;
    font-size: clamp(28px, 5vw, 38px);
    margin: 0 0 10px 0;
    color: var(--cream);
  }

  .board__sub {
    font-size: 15px;
    color: var(--cream-dim);
    margin: 0 0 36px 0;
    max-width: 46ch;
    line-height: 1.5;
  }

  .directory {
    border-top: 1px solid var(--panel-line);
  }

  .row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 20px;
    padding: 20px 4px;
    border-bottom: 1px solid var(--panel-line);
    text-decoration: none;
    color: inherit;
    transition: padding-left 0.2s ease, background 0.2s ease;
  }

  .row:hover {
    padding-left: 12px;
    background: var(--panel);
  }

  .row__info {
    min-width: 0;
  }

  .row__name {
    font-size: 17px;
    font-weight: 500;
    color: var(--cream);
    margin: 0 0 4px 0;
  }

  .row__meta {
    font-size: 13.5px;
    color: var(--cream-dim);
    margin: 0;
  }

  .row__cta {
    flex-shrink: 0;
    display: inline-flex;
    align-items: center;
    gap: 8px;
    font-size: 14px;
    font-weight: 500;
    color: var(--brass);
    white-space: nowrap;
  }

  .row__cta svg {
    width: 16px;
    height: 16px;
    stroke: var(--brass);
    fill: none;
    stroke-width: 1.8;
    transition: transform 0.2s ease;
  }

  .row:hover .row__cta svg {
    transform: translateX(3px);
  }

  .board__footnote {
    margin-top: 28px;
    font-size: 12.5px;
    color: var(--brass-dim);
    line-height: 1.6;
  }

  @media (max-width: 480px) {
    .row { flex-direction: column; align-items: flex-start; gap: 10px; }
    .row__cta { align-self: flex-start; }
  }
</style>
</head>
